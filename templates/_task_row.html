{% import "_macros.html" as m with context %}
<div class="trow {{ 'is-done' if t.status == 'done' }}">
  {% if can_edit(t) and t.status != 'done' %}
  <form method="post" action="{{ url_for('task_status', task_id=t.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="status" value="done">
    <input type="hidden" name="next" value="{{ request.full_path }}">
    <button class="tick" title="Mark as done"></button>
  </form>
  {% else %}<span class="tick {{ 'ticked' if t.status == 'done' }}"></span>{% endif %}
  <a class="trow-main" href="{{ url_for('task_detail', task_id=t.id) }}">
    <b translate="no">{{ t.title }}</b>
    <span class="meta">{{ m.project_tag(t) }} {{ m.status_pill(t.status) }} {{ m.checklist(t) }} {{ m.extras(t) }}</span>
  </a>
  <span class="trow-side">{{ m.priority_pill(t.priority) }} {{ m.due(t) }}</span>
</div>
