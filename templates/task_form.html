{% extends "base.html" %}
{% block title %}{{ 'Edit task' if task else 'New task' }}{% endblock %}
{% block content %}
<div class="crumbs"><a href="{{ url_for('task_list') }}">Tasks</a> / {% if task %}<a href="{{ url_for('task_detail', task_id=task.id) }}">#{{ task.id }}</a> / Edit{% else %}New{% endif %}</div>
<div class="form-wrap">
  <section class="card">
    <h1>{{ 'Edit task' if task else 'Create a new task' }}</h1>
    <form method="post" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Title<input name="title" value="{{ form.get('title', '') }}" required minlength="3" maxlength="120" placeholder="e.g. Prepare monthly sales report" autofocus></label>
      <label>Description<textarea name="description" rows="5" placeholder="Add details, links or steps…">{{ form.get('description', '') }}</textarea></label>
      <div class="row2">
        <label>Project
          <select name="project_id"><option value="">No project</option>
            {% for p in projects %}<option value="{{ p.id }}" {{ 'selected' if form.get('project_id') == p.id|string }}>{{ p.name }}</option>{% endfor %}
          </select></label>
        <label>Assignee
          <select name="assignee_id"><option value="">Unassigned</option>
            {% for u in users %}<option value="{{ u.id }}" {{ 'selected' if form.get('assignee_id') == u.id|string }}>{{ u.name }}{{ ' (me)' if u.id == user.id }}</option>{% endfor %}
          </select></label>
      </div>
      <div class="row3">
        <label>Status
          <select name="status">{% for k, n in STATUSES %}<option value="{{ k }}" {{ 'selected' if form.get('status') == k }}>{{ n }}</option>{% endfor %}</select></label>
        <label>Priority
          <select name="priority">{% for k, n in PRIORITIES %}<option value="{{ k }}" {{ 'selected' if form.get('priority') == k }}>{{ n }}</option>{% endfor %}</select></label>
        <label>Due date<input type="date" name="due_date" value="{{ form.get('due_date', '') }}" {% if not task %}min="{{ today.isoformat() }}"{% endif %}></label>
      </div>
      <div class="form-actions">
        <a class="btn btn-ghost" href="{{ url_for('task_detail', task_id=task.id) if task else url_for('task_list') }}">Cancel</a>
        <button class="btn btn-primary">{{ 'Save changes' if task else 'Create task' }}</button>
      </div>
    </form>
  </section>
</div>
{% endblock %}
